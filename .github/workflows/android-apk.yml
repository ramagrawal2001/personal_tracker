name: Build Android APK

# Builds a release APK on every push to main (and on demand) and publishes it
# to a GitHub Release so it can be side-loaded straight onto a phone.
# Latest build: https://github.com/ramagrawal2001/personal_tracker/releases/latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        id: rename
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r')
          SHORT_SHA=${GITHUB_SHA::7}
          APK_NAME="aspyric-v${VERSION}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/${APK_NAME}"
          echo "apk_path=build/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aspyric v${{ steps.rename.outputs.version }} (build ${{ github.run_number }})
          body: >
            Automated release build from commit ${{ github.sha }} on ${{ github.ref_name }}.
            Install: open this page on your phone, download the .apk below, tap it,
            allow "install unknown apps" if prompted.
          files: ${{ steps.rename.outputs.apk_path }}
          make_latest: true
